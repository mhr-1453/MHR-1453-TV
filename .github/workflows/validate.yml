
name: MHR-1453 TV Otomatik Kontrol

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "mhr-1453-tv.m3u"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Hızlı M3U Kontrolü
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Yayınları kontrol et
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          import os

          file = Path("mhr-1453-tv.m3u")

          if not file.exists():
              raise SystemExit("M3U dosyası bulunamadı!")

          lines = [
              x.strip()
              for x in file.read_text(encoding="utf-8-sig").splitlines()
              if x.strip()
          ]

          if not lines or lines[0] != "#EXTM3U":
              raise SystemExit("Geçersiz M3U başlığı!")

          channels = []
          pending = None

          for line in lines[1:]:
              if line.startswith("#EXTINF:"):
                  if pending is not None:
                      raise SystemExit("Eksik yayın adresi!")
                  pending = line.rsplit(",", 1)[-1].strip() or "İsimsiz kanal"

              elif not line.startswith("#"):
                  if pending is None:
                      raise SystemExit("Bağımsız yayın adresi!")
                  if not line.startswith(("http://", "https://")):
                      raise SystemExit(f"Geçersiz adres: {pending}")
                  channels.append((pending, line))
                  pending = None

          if pending is not None:
              raise SystemExit("Son kanalın adresi eksik!")

          if not channels:
              raise SystemExit("Hiç kanal bulunamadı!")

          USER_AGENTS = [
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36",
              "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/131.0.0.0 Mobile Safari/537.36",
              "VLC/3.0.21 LibVLC/3.0.21"
          ]

          def check_channel(channel):
              name, url = channel
              last_error = "Bilinmeyen hata"

              for ua in USER_AGENTS:
                  request = Request(
                      url,
                      headers={
                          "User-Agent": ua,
                          "Accept": "*/*",
                          "Range": "bytes=0-4095"
                      }
                  )

                  try:
                      with urlopen(request, timeout=5) as response:
                          status = response.status
                          sample = response.read(4096)

                      if status in (200, 206):
                          if b"#EXTM3U" in sample:
                              return name, "OK", f"HTTP {status} - HLS geçerli"
                          return name, "WARN", f"HTTP {status} - İçerik alındı"

                  except HTTPError as error:
                      last_error = f"HTTP {error.code}"

                      if error.code == 403:
                          continue

                      if error.code in (401, 429, 503):
                          return name, "WARN", last_error

                      return name, "FAIL", last_error

                  except (URLError, TimeoutError, OSError) as error:
                      last_error = str(error)
                      break

              if "403" in last_error:
                  return name, "BLOCKED", "HTTP 403 - Erişim engelli"

              return name, "FAIL", last_error

          results = []

          print(f"{len(channels)} kanal kontrol ediliyor...")

          with ThreadPoolExecutor(max_workers=20) as executor:
              futures = [
                  executor.submit(check_channel, channel)
                  for channel in channels
              ]

              for future in as_completed(futures):
                  result = future.result()
                  results.append(result)
                  print(f"{result[1]} - {result[0]}: {result[2]}")

          results.sort(key=lambda x: x[0].casefold())

          counts = {
              state: sum(1 for x in results if x[1] == state)
              for state in ("OK", "WARN", "BLOCKED", "FAIL")
          }

          labels = {
              "OK": "✅ OK",
              "WARN": "⚠️ Uyarı",
              "BLOCKED": "🚫 Engellendi",
              "FAIL": "❌ Hata"
          }

          summary = [
              "## MHR-1453 TV Hızlı Kontrol",
              "",
              f"- Toplam: **{len(channels)}**",
              f"- Erişilebilir: **{counts['OK']}**",
              f"- Uyarı: **{counts['WARN']}**",
              f"- Engelli: **{counts['BLOCKED']}**",
              f"- Hata: **{counts['FAIL']}**",
              "",
              "| Kanal | Durum | Açıklama |",
              "|---|---|---|"
          ]

          for name, state, detail in results:
              summary.append(
                  f"| {name.replace('|', '/')} | {labels[state]} | "
                  f"{detail.replace('|', '/')} |"
              )

          summary.append("")
          summary.append(
              "> HTTP kontrolüdür; gerçek görüntü ve ses oynatımını garanti etmez."
          )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(summary) + "\n")

          print("\nKontrol tamamlandı!")
          PY
