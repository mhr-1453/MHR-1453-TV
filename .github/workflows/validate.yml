
name: MHR-1453 TV Proxy Test

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:
  push:
    paths:
      - "mhr-1453-tv.m3u"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

concurrency:
  group: mhr1453-proxy-check
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Araçları kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            python3-pip \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav

          python3 -m pip install httpx --break-system-packages

      - name: Proxy ve yayın kontrolü
        run: |
          python3 - <<'PY'
          import httpx
          import subprocess
          import json
          import os
          import time
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed

          M3U = Path("mhr-1453-tv.m3u")

          PROXY_LIST = (
              "https://cdn.jsdelivr.net/gh/"
              "proxyscrape/free-proxy-list@main/"
              "proxies/protocols/http/data.txt"
          )

          TEST_URL = "https://api.ipify.org"
          USER_AGENT = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 Chrome/131.0 Safari/537.36"
          )

          HEADERS = {
              "User-Agent": USER_AGENT,
              "Accept": "*/*"
          }

          if not M3U.exists():
              raise SystemExit("M3U bulunamadı!")

          # M3U dosyasını oku
          lines = [
              x.strip()
              for x in M3U.read_text(
                  encoding="utf-8-sig"
              ).splitlines()
              if x.strip()
          ]

          if not lines or lines[0] != "#EXTM3U":
              raise SystemExit("Geçersiz M3U!")

          channels = []
          pending = None

          for line in lines[1:]:
              if line.startswith("#EXTINF:"):
                  pending = line.rsplit(",", 1)[-1].strip()

              elif not line.startswith("#"):
                  if pending:
                      channels.append((pending, line))
                      pending = None

          if not channels:
              raise SystemExit("Kanal bulunamadı!")

          # Proxy listesini indir
          print("ProxyScrape listesi indiriliyor...")

          response = httpx.get(
              PROXY_LIST,
              timeout=30,
              follow_redirects=True
          )
          response.raise_for_status()

          proxy_candidates = []

          for line in response.text.splitlines():
              line = line.strip()

              if not line or ":" not in line:
                  continue

              if line.startswith("http://"):
                  proxy = line
              elif line.startswith("https://"):
                  proxy = line
              else:
                  proxy = "http://" + line

              if proxy not in proxy_candidates:
                  proxy_candidates.append(proxy)

          print(
              f"İndirilen proxy sayısı: "
              f"{len(proxy_candidates)}"
          )

          # Proxy bağlantı testi
          def test_proxy(proxy):
              try:
                  with httpx.Client(
                      proxy=proxy,
                      timeout=7,
                      follow_redirects=True,
                      headers=HEADERS
                  ) as client:
                      r = client.get(TEST_URL)

                      if r.status_code == 200 and r.text.strip():
                          return proxy

              except Exception:
                  pass

              return None

          working_proxies = []

          with ThreadPoolExecutor(max_workers=30) as pool:
              futures = [
                  pool.submit(test_proxy, p)
                  for p in proxy_candidates[:300]
              ]

              for future in as_completed(futures):
                  result = future.result()

                  if result:
                      working_proxies.append(result)
                      print("Çalışan proxy bulundu.")

                      if len(working_proxies) >= 5:
                          break

          print(
              f"Çalışan proxy sayısı: "
              f"{len(working_proxies)}"
          )

          # HLS playlist kontrolü
          def check_hls(client, url, content):
              try:
                  text = content.decode(
                      "utf-8-sig",
                      errors="replace"
                  )

                  rows = [
                      x.strip()
                      for x in text.splitlines()
                      if x.strip()
                  ]

                  if not rows or rows[0] != "#EXTM3U":
                      return False, "HLS playlist hatalı"

                  target = None

                  for row in rows:
                      if not row.startswith("#"):
                          target = httpx.URL(url).join(row)
                          break

                  if target is None:
                      return False, "Segment bulunamadı"

                  r = client.get(
                      str(target),
                      headers={"Range": "bytes=0-2047"}
                  )

                  if r.status_code in (200, 206):
                      if r.content:
                          return True, "HLS segment erişilebilir"

                  return False, f"Segment HTTP {r.status_code}"

              except Exception as e:
                  return False, str(e)[:100]

          # HTTP kontrolü
          def http_test(url, proxy=None):
              try:
                  with httpx.Client(
                      proxy=proxy,
                      headers=HEADERS,
                      follow_redirects=True,
                      timeout=15
                  ) as client:

                      r = client.get(
                          url,
                          headers={"Range": "bytes=0-65535"}
                      )

                      if r.status_code in (401, 403):
                          return False, f"HTTP {r.status_code}"

                      if r.status_code in (404, 410):
                          return False, f"HTTP {r.status_code}"

                      if r.status_code not in (200, 206):
                          return False, f"HTTP {r.status_code}"

                      content = r.content[:65536]

                      is_hls = (
                          ".m3u8" in url.lower()
                          or "mpegurl" in r.headers.get(
                              "content-type", ""
                          ).lower()
                          or content.lstrip().startswith(b"#EXTM3U")
                      )

                      if is_hls:
                          return check_hls(
                              client,
                              url,
                              content
                          )

                      return True, "HTTP erişilebilir"

              except Exception as e:
                  return False, str(e)[:100]

          # FFprobe
          def probe_test(url, proxy=None):
              cmd = [
                  "ffprobe",
                  "-v", "error",
                  "-rw_timeout", "15000000",
                  "-user_agent", USER_AGENT,
                  "-show_entries",
                  "stream=codec_type,codec_name",
                  "-of", "json"
              ]

              if proxy:
                  cmd += ["-http_proxy", proxy]

              cmd += ["-i", url]

              try:
                  r = subprocess.run(
                      cmd,
                      capture_output=True,
                      text=True,
                      timeout=25
                  )

                  if r.returncode != 0:
                      return False, False, False, "FFprobe başarısız"

                  data = json.loads(r.stdout)
                  streams = data.get("streams", [])

                  video = any(
                      x.get("codec_type") == "video"
                      for x in streams
                  )

                  audio = any(
                      x.get("codec_type") == "audio"
                      for x in streams
                  )

                  return True, video, audio, "FFprobe başarılı"

              except Exception:
                  return False, False, False, "FFprobe hatası"

          # FFmpeg çözümleme
          def ffmpeg_test(url, proxy=None):
              cmd = [
                  "ffmpeg",
                  "-nostdin",
                  "-hide_banner",
                  "-loglevel", "error",
                  "-rw_timeout", "15000000",
                  "-user_agent", USER_AGENT
              ]

              if proxy:
                  cmd += ["-http_proxy", proxy]

              cmd += [
                  "-i", url,
                  "-t", "8",
                  "-map", "0:v:0?",
                  "-map", "0:a:0?",
                  "-f", "null",
                  "-"
              ]

              try:
                  r = subprocess.run(
                      cmd,
                      capture_output=True,
                      text=True,
                      timeout=35
                  )

                  return (
                      r.returncode == 0,
                      "FFmpeg başarılı"
                      if r.returncode == 0
                      else "FFmpeg başarısız"
                  )

              except Exception:
                  return False, "FFmpeg zaman aşımı/hatası"

          # GStreamer keşfi
          def gst_test(url):
              try:
                  r = subprocess.run(
                      ["gst-discoverer-1.0", "-t", "12", url],
                      capture_output=True,
                      text=True,
                      timeout=20
                  )

                  output = (
                      r.stdout + r.stderr
                  ).lower()

                  found = (
                      r.returncode == 0
                      and (
                          "video" in output
                          or "audio" in output
                      )
                  )

                  return found

              except Exception:
                  return False

          # Kanal kontrolü
          def check_channel(channel):
              name, url = channel

              attempts = [None] + working_proxies

              for proxy in attempts:
                  ok, detail = http_test(url, proxy)

                  if not ok:
                      continue

                  probe_ok, video, audio, probe_detail = (
                      probe_test(url, proxy)
                  )

                  ff_ok, ff_detail = ffmpeg_test(url, proxy)

                  gst_ok = gst_test(url)

                  if ff_ok and video and audio:
                      return (
                          name,
                          "OK",
                          "Ses + görüntü doğrulandı",
                          "Proxy: " + (
                              proxy or "Doğrudan bağlantı"
                          )
                      )

                  if probe_ok or gst_ok:
                      return (
                          name,
                          "KISMİ",
                          "Medya akışı bulundu; tam çözümleme yok",
                          "Proxy: " + (
                              proxy or "Doğrudan bağlantı"
                          )
                      )

                  return (
                      name,
                      "ERİŞİLEBİLİR",
                      detail + " | " + ff_detail,
                      "Proxy: " + (
                          proxy or "Doğrudan bağlantı"
                      )
                  )

              return (
                  name,
                  "DOĞRULANAMADI",
                  "Doğrudan ve test edilen proxy bağlantıları başarısız",
                  "401/403 veya bağlantı hatası olabilir"
              )

          print("\nKanal testleri başlıyor...\n")

          results = []

          with ThreadPoolExecutor(max_workers=4) as pool:
              futures = [
                  pool.submit(check_channel, channel)
                  for channel in channels
              ]

              for future in as_completed(futures):
                  result = future.result()
                  results.append(result)

                  print(
                      f"{result[1]} - {result[0]} | "
                      f"{result[2]} | {result[3]}"
                  )

          results.sort(key=lambda x: x[0].casefold())

          counts = {}

          for result in results:
              counts[result[1]] = counts.get(result[1], 0) + 1

          summary = [
              "# MHR-1453 TV Proxy Kontrolü",
              "",
              f"- Toplam kanal: {len(results)}",
              f"- İndirilen proxy: {len(proxy_candidates)}",
              f"- Çalışan proxy: {len(working_proxies)}",
              "",
              "## Durumlar",
              ""
          ]

          for state, count in counts.items():
              summary.append(f"- {state}: {count}")

          summary.extend([
              "",
              "## Kanal sonuçları",
              "",
              "| Kanal | Durum | Detay | Bağlantı |",
              "|---|---|---|---|"
          ])

          for name, state, detail, proxy in results:
              summary.append(
                  f"| {name.replace('|', '/')} "
                  f"| {state} "
                  f"| {detail.replace('|', '/')} "
                  f"| {proxy.replace('|', '/')} |"
              )

          summary.extend([
              "",
              "> Proxy bağlantısı başarılı olması, yayın akışının "
              "oynatılabildiğini tek başına kanıtlamaz.",
              "",
              "> GStreamer testi doğrudan bağlantıyla yapılır; "
              "FFmpeg ve FFprobe proxy seçimini kullanır."
          ])

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8"
          ) as f:
              f.write("\n".join(summary) + "\n")

          print("\nKontrol tamamlandı!")
          PY
