
name: MHR-1453 TV - HLS Proxy Monitor

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:
  push:
    paths:
      - "mhr-1453-tv.m3u"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

concurrency:
  group: mhr1453-hls-check
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: FFmpeg ve GStreamer kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            python3-httpx \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav

      - name: HLS ve proxy kontrolü
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.parse import urljoin
          import subprocess
          import httpx
          import json
          import os
          import time
          import re

          FILE = Path("mhr-1453-tv.m3u")

          PROXY_LIST = (
              "https://cdn.jsdelivr.net/gh/"
              "proxyscrape/free-proxy-list@main/"
              "proxies/protocols/http/data.txt"
          )

          USER_AGENT = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 Chrome/131.0 Safari/537.36"
          )

          HEADERS = {
              "User-Agent": USER_AGENT,
              "Accept": "*/*"
          }

          TIMEOUT = httpx.Timeout(
              connect=8,
              read=12,
              write=8,
              pool=8
          )

          if not FILE.exists():
              raise SystemExit("M3U bulunamadı!")

          lines = [
              x.strip()
              for x in FILE.read_text(
                  encoding="utf-8-sig"
              ).splitlines()
              if x.strip()
          ]

          if not lines or lines[0] != "#EXTM3U":
              raise SystemExit("Geçersiz M3U!")

          channels = []
          pending = None

          for line in lines[1:]:
              if line.startswith("#EXTINF:"):
                  pending = line.rsplit(",", 1)[-1].strip()

              elif not line.startswith("#"):
                  if pending:
                      channels.append((pending, line))
                      pending = None

          if not channels:
              raise SystemExit("Kanal bulunamadı!")

          # Proxy listesini al
          print("Proxy listesi indiriliyor...")

          proxy_candidates = []

          try:
              r = httpx.get(
                  PROXY_LIST,
                  timeout=25,
                  follow_redirects=True
              )
              r.raise_for_status()

              for line in r.text.splitlines():
                  line = line.strip()

                  if not line or ":" not in line:
                      continue

                  if line.startswith(("http://", "https://")):
                      proxy = line
                  else:
                      proxy = "http://" + line

                  if proxy not in proxy_candidates:
                      proxy_candidates.append(proxy)

          except Exception as e:
              print("Proxy listesi alınamadı:", str(e)[:100])

          print("Proxy adayı:", len(proxy_candidates))

          # Proxy testi
          def test_proxy(proxy):
              try:
                  with httpx.Client(
                      proxy=proxy,
                      headers=HEADERS,
                      timeout=7,
                      follow_redirects=True
                  ) as client:
                      r = client.get("https://api.ipify.org")

                      if r.status_code == 200 and r.text.strip():
                          return proxy

              except Exception:
                  pass

              return None

          working_proxies = []

          with ThreadPoolExecutor(max_workers=25) as pool:
              futures = [
                  pool.submit(test_proxy, p)
                  for p in proxy_candidates[:250]
              ]

              for future in as_completed(futures):
                  result = future.result()

                  if result:
                      working_proxies.append(result)
                      print("Çalışan proxy bulundu.")

                      if len(working_proxies) >= 5:
                          break

          print("Çalışan proxy:", len(working_proxies))

          def request_client(proxy=None):
              return httpx.Client(
                  proxy=proxy,
                  headers=HEADERS,
                  follow_redirects=True,
                  timeout=TIMEOUT
              )

          def fetch(client, url, limit=65536):
              with client.stream("GET", url) as response:
                  status = response.status_code

                  if status in (401, 403):
                      return status, b""

                  if status not in (200, 206):
                      return status, b""

                  data = bytearray()

                  for chunk in response.iter_bytes(8192):
                      data.extend(chunk)

                      if len(data) >= limit:
                          break

                  return status, bytes(data[:limit])

          # HLS playlist, alt playlist, segment ve anahtar kontrolü
          def hls_check(client, url, depth=0):
              try:
                  if depth > 2:
                      return "Şüpheli", "HLS alt playlist derinliği aşıldı"

                  status, content = fetch(client, url)

                  if status in (401, 403):
                      return "Yetkilendirme", f"Playlist HTTP {status}"

                  if status not in (200, 206):
                      return "Şüpheli", f"Playlist HTTP {status}"

                  text = content.decode(
                      "utf-8-sig",
                      errors="replace"
                  )

                  rows = [
                      x.strip()
                      for x in text.splitlines()
                      if x.strip()
                  ]

                  if not rows or rows[0] != "#EXTM3U":
                      return "Şüpheli", "Geçersiz HLS başlığı"

                  # Master playlist
                  for index, row in enumerate(rows):
                      if row.startswith("#EXT-X-STREAM-INF"):
                          for next_row in rows[index + 1:]:
                              if not next_row.startswith("#"):
                                  child_url = urljoin(url, next_row)
                                  return hls_check(
                                      client,
                                      child_url,
                                      depth + 1
                                  )

                  # Alternatif medya playlisti
                  for row in rows:
                      if row.startswith("#EXT-X-MEDIA:"):
                          match = re.search(
                              r'URI="([^"]+)"',
                              row
                          )

                          if match:
                              media_url = urljoin(
                                  url,
                                  match.group(1)
                              )

                              if "TYPE=AUDIO" in row:
                                  media_status, media_data = fetch(
                                      client,
                                      media_url
                                  )

                                  if media_status not in (200, 206):
                                      if media_status in (401, 403):
                                          return (
                                              "Yetkilendirme",
                                              f"Ses playlist HTTP {media_status}"
                                          )

                  # Şifreleme anahtarları
                  key_count = 0

                  for row in rows:
                      if row.startswith("#EXT-X-KEY:"):
                          match = re.search(
                              r'URI="([^"]+)"',
                              row
                          )

                          if match:
                              key_url = urljoin(url, match.group(1))
                              key_status, key_data = fetch(
                                  client,
                                  key_url,
                                  4096
                              )

                              if key_status in (401, 403):
                                  return (
                                      "Yetkilendirme",
                                      f"HLS anahtarı HTTP {key_status}"
                                  )

                              if key_status not in (200, 206):
                                  return (
                                      "Şüpheli",
                                      f"HLS anahtarı HTTP {key_status}"
                                  )

                              key_count += 1

                  # İlk üç medya segmenti
                  segments = [
                      row for row in rows
                      if not row.startswith("#")
                  ]

                  if not segments:
                      return "Şüpheli", "Segment bulunamadı"

                  checked = 0

                  for segment in segments[:3]:
                      segment_url = urljoin(url, segment)

                      seg_status, seg_data = fetch(
                          client,
                          segment_url,
                          4096
                      )

                      if seg_status in (401, 403):
                          return (
                              "Yetkilendirme",
                              f"Segment HTTP {seg_status}"
                          )

                      if seg_status not in (200, 206):
                          return (
                              "Şüpheli",
                              f"Segment HTTP {seg_status}"
                          )

                      if not seg_data:
                          return "Şüpheli", "Boş segment"

                      checked += 1

                  return (
                      "OK",
                      f"{checked} segment kontrol edildi, "
                      f"{key_count} anahtar kontrol edildi"
                  )

              except Exception as e:
                  return "Şüpheli", str(e)[:120]

          # HTTP ve HLS testi
          def http_test(url, proxy=None):
              try:
                  with request_client(proxy) as client:
                      content_type = ""

                      status, content = fetch(client, url)

                      if status in (401, 403):
                          return "Yetkilendirme", f"HTTP {status}"

                      if status in (404, 410):
                          return "FAIL", f"HTTP {status}"

                      if status not in (200, 206):
                          return "Şüpheli", f"HTTP {status}"

                      is_hls = (
                          ".m3u8" in url.lower()
                          or content.lstrip().startswith(b"#EXTM3U")
                      )

                      if is_hls:
                          state, detail = hls_check(
                              client,
                              url
                          )

                          return state, detail

                      return "OK", "HTTP erişilebilir"

              except Exception as e:
                  return "Şüpheli", str(e)[:100]

          # FFprobe
          def probe_test(url, proxy=None):
              cmd = [
                  "ffprobe",
                  "-v", "error",
                  "-rw_timeout", "15000000",
                  "-user_agent", USER_AGENT,
                  "-show_entries",
                  "stream=codec_type,codec_name",
                  "-of", "json"
              ]

              if proxy:
                  cmd += ["-http_proxy", proxy]

              cmd += ["-i", url]

              try:
                  r = subprocess.run(
                      cmd,
                      capture_output=True,
                      text=True,
                      timeout=25
                  )

                  if r.returncode != 0:
                      return False, False, False, "FFprobe başarısız"

                  streams = json.loads(
                      r.stdout
                  ).get("streams", [])

                  video = any(
                      s.get("codec_type") == "video"
                      for s in streams
                  )

                  audio = any(
                      s.get("codec_type") == "audio"
                      for s in streams
                  )

                  return (
                      bool(video or audio),
                      video,
                      audio,
                      "FFprobe başarılı"
                  )

              except Exception:
                  return False, False, False, "FFprobe hatası"

          # FFmpeg medya çözümleme
          def ffmpeg_test(url, proxy=None):
              cmd = [
                  "ffmpeg",
                  "-nostdin",
                  "-hide_banner",
                  "-loglevel", "error",
                  "-rw_timeout", "15000000",
                  "-user_agent", USER_AGENT
              ]

              if proxy:
                  cmd += ["-http_proxy", proxy]

              cmd += [
                  "-i", url,
                  "-t", "8",
                  "-map", "0:v:0?",
                  "-map", "0:a:0?",
                  "-f", "null",
                  "-"
              ]

              try:
                  r = subprocess.run(
                      cmd,
                      capture_output=True,
                      text=True,
                      timeout=35
                  )

                  return r.returncode == 0

              except Exception:
                  return False

          # GStreamer
          def gst_test(url):
              try:
                  r = subprocess.run(
                      ["gst-discoverer-1.0", "-t", "12", url],
                      capture_output=True,
                      text=True,
                      timeout=20
                  )

                  output = (
                      r.stdout + r.stderr
                  ).lower()

                  return (
                      r.returncode == 0
                      and (
                          "video" in output
                          or "audio" in output
                      )
                  )

              except Exception:
                  return False

          def check_channel(channel):
              name, url = channel

              connection_options = [None] + working_proxies
              last_detail = "Bağlantı kurulamadı"

              for proxy in connection_options:
                  state, detail = http_test(url, proxy)

                  if state == "FAIL":
                      return name, "FAIL", detail, "HTTP"

                  if state == "Yetkilendirme":
                      last_detail = detail
                      continue

                  if state != "OK":
                      last_detail = detail
                      continue

                  probe_ok, video, audio, probe_detail = (
                      probe_test(url, proxy)
                  )

                  ff_ok = ffmpeg_test(url, proxy)
                  gst_ok = gst_test(url)

                  if ff_ok and video and audio:
                      return (
                          name,
                          "OK",
                          "HLS + ses + görüntü doğrulandı",
                          proxy or "Doğrudan"
                      )

                  if probe_ok or gst_ok:
                      return (
                          name,
                          "KISMİ",
                          "Akış bulundu fakat tam çözümleme yok",
                          proxy or "Doğrudan"
                      )

                  return (
                      name,
                      "ERİŞİLEBİLİR",
                      detail + " | Medya doğrulanamadı",
                      proxy or "Doğrudan"
                  )

              return (
                  name,
                  "DOĞRULANAMADI",
                  last_detail,
                  "Doğrudan/proxy testi başarısız"
              )

          print("\nKanal kontrolü başlıyor...\n")

          results = []

          with ThreadPoolExecutor(max_workers=4) as pool:
              futures = [
                  pool.submit(check_channel, c)
                  for c in channels
              ]

              for future in as_completed(futures):
                  result = future.result()
                  results.append(result)

                  print(
                      f"{result[1]} - {result[0]}: "
                      f"{result[2]}"
                  )

          results.sort(key=lambda x: x[0].casefold())

          counts = {}

          for item in results:
              counts[item[1]] = counts.get(item[1], 0) + 1

          summary = [
              "# MHR-1453 TV - HLS Proxy Kontrolü",
              "",
              f"- Toplam kanal: {len(results)}",
              f"- Proxy adayı: {len(proxy_candidates)}",
              f"- Çalışan proxy: {len(working_proxies)}",
              ""
          ]

          for state, count in counts.items():
              summary.append(f"- {state}: {count}")

          summary.extend([
              "",
              "| Kanal | Durum | Detay | Bağlantı |",
              "|---|---|---|---|"
          ])

          for name, state, detail, proxy in results:
              summary.append(
                  f"| {name.replace('|', '/')} "
                  f"| {state} "
                  f"| {detail.replace('|', '/')} "
                  f"| {str(proxy).replace('|', '/')} |"
              )

          summary.extend([
              "",
              "> HLS testi ana playlist, alt playlist, ilk üç segment "
              "ve varsa şifreleme anahtarlarını kontrol eder.",
              "",
              "> Proxy testi başarılı olması yayın oynatma garantisi değildir."
          ])

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8"
          ) as f:
              f.write("\n".join(summary) + "\n")

          print("\nKontrol tamamlandı!")
          PY
