
name: MHR-1453 TV - DNS HLS Monitor

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:
  push:
    paths:
      - "mhr-1453-tv.m3u"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

concurrency:
  group: mhr1453-hls-check
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --upgrade httpx dnspython

      - name: DNS and HLS checks
        run: |
          python3 - <<'PY'
          import os
          import re
          import json
          import socket
          import httpx
          import dns.resolver
          import subprocess

          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from concurrent.futures import ThreadPoolExecutor, as_completed

          FILE = Path("mhr-1453-tv.m3u")

          USER_AGENT = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 Chrome/131.0 Safari/537.36"
          )

          HEADERS = {
              "User-Agent": USER_AGENT,
              "Accept": "*/*"
          }

          TIMEOUT = httpx.Timeout(
              connect=8,
              read=15,
              write=8,
              pool=8
          )

          MAX_WORKERS = 8

          DNS_SERVERS = [
              ("Google", "8.8.8.8"),
              ("Cloudflare", "1.1.1.1"),
              ("Quad9", "9.9.9.9")
          ]

          if not FILE.exists():
              raise SystemExit("M3U dosyası bulunamadı!")

          lines = [
              x.strip()
              for x in FILE.read_text(
                  encoding="utf-8-sig"
              ).splitlines()
              if x.strip()
          ]

          if not lines or lines[0] != "#EXTM3U":
              raise SystemExit("Geçersiz M3U!")

          channels = []
          pending = None

          for line in lines[1:]:
              if line.startswith("#EXTINF:"):
                  pending = line.rsplit(",", 1)[-1].strip()

              elif not line.startswith("#") and pending:
                  channels.append((pending, line))
                  pending = None

          if not channels:
              raise SystemExit("Kanal bulunamadı!")

          print("Toplam kanal:", len(channels))

          # DNS-over-HTTPS çözümleme
          DOH_ENDPOINTS = [
              ("Google", "https://dns.google/resolve"),
              ("Cloudflare", "https://cloudflare-dns.com/dns-query")
          ]

          dns_cache = {}

          def resolve_dns(host):
              if host in dns_cache:
                  return dns_cache[host]

              for provider, endpoint in DOH_ENDPOINTS:
                  try:
                      headers = {
                          "accept": "application/dns-json",
                          "user-agent": USER_AGENT
                      }

                      response = httpx.get(
                          endpoint,
                          params={
                              "name": host,
                              "type": "A"
                          },
                          headers=headers,
                          timeout=5
                      )

                      response.raise_for_status()
                      data = response.json()

                      if data.get("Status") != 0:
                          continue

                      addresses = [
                          item["data"]
                          for item in data.get("Answer", [])
                          if item.get("type") == 1
                      ]

                      if addresses:
                          dns_cache[host] = (
                              addresses[0],
                              provider
                          )

                          return dns_cache[host]

                  except Exception:
                      continue

              # Son seçenek: sistem DNS'i
              try:
                  addresses = socket.getaddrinfo(
                      host,
                      None,
                      socket.AF_INET
                  )

                  if addresses:
                      result = (
                          addresses[0][4][0],
                          "Sistem DNS"
                      )

                      dns_cache[host] = result
                      return result

              except Exception:
                  pass

              dns_cache[host] = (None, "Başarısız")
              return dns_cache[host]

          def make_client():
              return httpx.Client(
                  headers=HEADERS,
                  timeout=TIMEOUT,
                  follow_redirects=True
              )

          def fetch(client, url, limit=32768):
              with client.stream("GET", url) as response:
                  status = response.status_code
                  data = bytearray()

                  if status in (200, 206):
                      for chunk in response.iter_bytes(8192):
                          data.extend(chunk)

                          if len(data) >= limit:
                              break

                  return status, bytes(data[:limit])

          def hls_check(client, url, depth=0):
              if depth > 2:
                  return False, "Playlist derinliği aşıldı"

              try:
                  status, data = fetch(client, url)

                  if status in (401, 403):
                      return False, f"HTTP {status}"

                  if status not in (200, 206):
                      return False, f"Playlist HTTP {status}"

                  content = data.decode(
                      "utf-8-sig",
                      errors="replace"
                  )

                  rows = [
                      x.strip()
                      for x in content.splitlines()
                      if x.strip()
                  ]

                  if not rows or rows[0] != "#EXTM3U":
                      return False, "Geçersiz HLS"

                  for index, row in enumerate(rows):
                      if row.startswith("#EXT-X-STREAM-INF"):
                          for next_row in rows[index + 1:]:
                              if not next_row.startswith("#"):
                                  return hls_check(
                                      client,
                                      urljoin(url, next_row),
                                      depth + 1
                                  )

                  segments = [
                      row for row in rows
                      if not row.startswith("#")
                  ]

                  if not segments:
                      return False, "Segment bulunamadı"

                  segment_url = urljoin(url, segments[0])

                  seg_status, seg_data = fetch(
                      client,
                      segment_url,
                      16384
                  )

                  if seg_status in (401, 403):
                      return False, f"Segment HTTP {seg_status}"

                  if seg_status not in (200, 206):
                      return False, f"Segment HTTP {seg_status}"

                  if not seg_data:
                      return False, "Boş segment"

                  return True, "HLS playlist ve segment erişilebilir"

              except Exception as e:
                  return False, str(e)[:100]

          def probe_test(url):
              cmd = [
                  "ffprobe",
                  "-v", "error",
                  "-rw_timeout", "12000000",
                  "-user_agent", USER_AGENT,
                  "-probesize", "2000000",
                  "-analyzeduration", "2000000",
                  "-show_entries",
                  "stream=codec_type,codec_name",
                  "-of", "json",
                  "-i", url
              ]

              try:
                  result = subprocess.run(
                      cmd,
                      capture_output=True,
                      text=True,
                      timeout=15
                  )

                  if result.returncode != 0:
                      return False, False, False

                  streams = json.loads(
                      result.stdout
                  ).get("streams", [])

                  video = any(
                      s.get("codec_type") == "video"
                      for s in streams
                  )

                  audio = any(
                      s.get("codec_type") == "audio"
                      for s in streams
                  )

                  return bool(video or audio), video, audio

              except Exception:
                  return False, False, False

          def ffmpeg_test(url):
              cmd = [
                  "ffmpeg",
                  "-nostdin",
                  "-hide_banner",
                  "-loglevel", "error",
                  "-rw_timeout", "12000000",
                  "-user_agent", USER_AGENT,
                  "-i", url,
                  "-t", "3",
                  "-map", "0:v:0?",
                  "-map", "0:a:0?",
                  "-f", "null",
                  "-"
              ]

              try:
                  result = subprocess.run(
                      cmd,
                      capture_output=True,
                      text=True,
                      timeout=18
                  )

                  return result.returncode == 0

              except Exception:
                  return False

          def check_channel(channel):
              name, url = channel

              try:
                  host = urlparse(url).hostname

                  if not host:
                      return (
                          name,
                          "GEÇERSİZ URL",
                          "Alan adı bulunamadı",
                          "-"
                      )

                  ip, provider = resolve_dns(host)

                  if not ip:
                      return (
                          name,
                          "DNS HATASI",
                          "Google, Cloudflare ve sistem DNS başarısız",
                          "Başarısız"
                      )

                  print(
                      f"DNS OK | {name} | {provider} | {ip}"
                  )

                  with make_client() as client:
                      status, data = fetch(client, url)

                      if status in (401, 403):
                          return (
                              name,
                              "YETKİLENDİRME",
                              f"HTTP {status}",
                              provider
                          )

                      if status in (404, 410):
                          return (
                              name,
                              "KANAL HATASI",
                              f"HTTP {status}",
                              provider
                          )

                      if status not in (200, 206):
                          return (
                              name,
                              "BAĞLANTI HATASI",
                              f"HTTP {status}",
                              provider
                          )

                      is_hls = (
                          ".m3u8" in url.lower()
                          or data.lstrip().startswith(b"#EXTM3U")
                      )

                      if is_hls:
                          ok, detail = hls_check(client, url)

                          if not ok:
                              return (
                                  name,
                                  "HLS HATASI",
                                  detail,
                                  provider
                              )

                  probe_ok, video, audio = probe_test(url)
                  ff_ok = ffmpeg_test(url)

                  if probe_ok and video and audio and ff_ok:
                      state = "BAŞARILI"
                      detail = "Ses ve görüntü doğrulandı"

                  elif probe_ok or ff_ok:
                      state = "KISMİ"
                      detail = (
                          f"Video: {video} | Ses: {audio}"
                      )

                  else:
                      state = "ERİŞİLEBİLİR"
                      detail = (
                          "HTTP/HLS erişilebilir, medya "
                          "çözümlemesi doğrulanamadı"
                      )

                  return name, state, detail, provider

              except Exception as e:
                  return (
                      name,
                      "KONTROL HATASI",
                      str(e)[:100],
                      "-"
                  )

          results = []

          with ThreadPoolExecutor(
              max_workers=MAX_WORKERS
          ) as executor:

              futures = [
                  executor.submit(check_channel, channel)
                  for channel in channels
              ]

              for future in as_completed(futures):
                  try:
                      result = future.result()
                      results.append(result)

                      print(
                          f"{result[1]} | {result[0]} | "
                          f"{result[2]}"
                      )

                  except Exception as e:
                      print("Hata:", str(e)[:100])

          results.sort(key=lambda x: x[0].casefold())

          counts = {}

          for name, state, detail, provider in results:
              counts[state] = counts.get(state, 0) + 1

          summary = [
              "# MHR-1453 TV - DNS HLS Raporu",
              "",
              f"- Toplam kanal: {len(channels)}",
              f"- Kontrol edilen: {len(results)}",
              f"- Paralel işçi: {MAX_WORKERS}",
              "- DNS: Google DoH / Cloudflare DoH / Sistem DNS",
              ""
          ]

          for state, count in sorted(counts.items()):
              summary.append(f"- {state}: {count}")

          summary.extend([
              "",
              "| Kanal | Durum | Detay | DNS |",
              "|---|---|---|---|"
          ])

          for name, state, detail, provider in results:
              summary.append(
                  f"| {name.replace('|', '/')} "
                  f"| {state} "
                  f"| {detail.replace('|', '/')} "
                  f"| {provider} |"
              )

          summary.extend([
              "",
              "> DNS çözümlemesi başarılı olması yayının "
              "oynatılabildiğini garanti etmez.",
              "",
              "> HTTP 401/403 DNS değiştirerek giderilemez."
          ])

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8"
          ) as f:
              f.write("\n".join(summary) + "\n")

          print("\nKontrol tamamlandı!")
          PY
