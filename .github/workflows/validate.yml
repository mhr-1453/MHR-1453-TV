
name: MHR-1453 TV - Advanced HLS Monitor

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:
  push:
    paths:
      - "mhr-1453-tv.m3u"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

concurrency:
  group: mhr1453-hls-check
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-httpx

      - name: Advanced HLS Validation
        run: |
          python3 - <<'PY'
          import os
          import re
          import json
          import time
          import subprocess
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, urlunparse
          from concurrent.futures import ThreadPoolExecutor, as_completed

          import httpx

          FILE = Path("mhr-1453-tv.m3u")

          USER_AGENT = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 Chrome/131.0 Safari/537.36"
          )

          HEADERS = {
              "User-Agent": USER_AGENT,
              "Accept": "*/*"
          }

          TIMEOUT = httpx.Timeout(
              connect=10,
              read=20,
              write=10,
              pool=10
          )

          WORKERS = 8
          RETRIES = 3
          MAX_VARIANTS = 3
          SEGMENTS_TO_TEST = 3
          MAX_PLAYLIST_SIZE = 1024 * 1024
          MAX_SEGMENT_SIZE = 65536

          if not FILE.exists():
              raise SystemExit("M3U dosyası bulunamadı!")

          lines = [
              x.strip()
              for x in FILE.read_text(
                  encoding="utf-8-sig"
              ).splitlines()
              if x.strip()
          ]

          if not lines or lines[0] != "#EXTM3U":
              raise SystemExit("Geçersiz M3U!")

          channels = []
          pending = None

          for line in lines[1:]:
              if line.startswith("#EXTINF:"):
                  pending = line.rsplit(",", 1)[-1].strip()

              elif not line.startswith("#") and pending:
                  channels.append((pending, line))
                  pending = None

          if not channels:
              raise SystemExit("Kanal bulunamadı!")

          def make_client():
              return httpx.Client(
                  headers=HEADERS,
                  timeout=TIMEOUT,
                  follow_redirects=True,
                  limits=httpx.Limits(
                      max_connections=10,
                      max_keepalive_connections=5
                  )
              )

          def inherit_query(parent_url, child_url):
              """
              Aynı host üzerindeki göreli segment URL'sine
              playlist query parametrelerini aktar.
              """
              parent = urlparse(parent_url)
              child = urlparse(child_url)

              if (
                  parent.hostname
                  and child.hostname
                  and parent.hostname.lower() == child.hostname.lower()
                  and not child.query
                  and parent.query
              ):
                  child = child._replace(query=parent.query)
                  return urlunparse(child)

              return child_url

          def resolve_url(parent, child):
              result = urljoin(parent, child)
              return inherit_query(parent, result)

          def get_bytes(client, url, limit, headers=None):
              last_error = "Bağlantı kurulamadı"

              for attempt in range(RETRIES):
                  try:
                      request_headers = dict(HEADERS)

                      if headers:
                          request_headers.update(headers)

                      with client.stream(
                          "GET",
                          url,
                          headers=request_headers
                      ) as response:

                          status = response.status_code

                          if status in (401, 403):
                              return status, b"", "Yetkilendirme"

                          if status in (404, 410):
                              last_error = f"HTTP {status}"
                              if attempt < RETRIES - 1:
                                  time.sleep(0.7)
                                  continue
                              return status, b"", last_error

                          if status not in (200, 206):
                              last_error = f"HTTP {status}"
                              if attempt < RETRIES - 1:
                                  time.sleep(0.7)
                                  continue
                              return status, b"", last_error

                          data = bytearray()

                          for chunk in response.iter_bytes(8192):
                              data.extend(chunk)

                              if len(data) >= limit:
                                  break

                          if not data:
                              last_error = "Boş yanıt"
                              if attempt < RETRIES - 1:
                                  time.sleep(0.7)
                                  continue
                              return status, b"", last_error

                          return status, bytes(data[:limit]), "OK"

                  except Exception as e:
                      last_error = str(e)[:120]

                      if attempt < RETRIES - 1:
                          time.sleep(0.7)

              return 0, b"", last_error

          def parse_attributes(line):
              result = {}

              if ":" not in line:
                  return result

              content = line.split(":", 1)[1]

              pattern = r'([A-Z0-9-]+)=("[^"]*"|[^,]*)'

              for match in re.finditer(pattern, content):
                  value = match.group(2).strip()

                  if value.startswith('"') and value.endswith('"'):
                      value = value[1:-1]

                  result[match.group(1)] = value

              return result

          def is_html(data):
              start = data[:512].lstrip().lower()

              return (
                  start.startswith(b"<!doctype html")
                  or start.startswith(b"<html")
                  or start.startswith(b"<head")
                  or start.startswith(b"<body")
              )

          def check_media_resource(
              client,
              url,
              kind,
              byte_range=None
          ):
              headers = {}

              if byte_range:
                  headers["Range"] = byte_range

              status, data, detail = get_bytes(
                  client,
                  url,
                  MAX_SEGMENT_SIZE,
                  headers
              )

              if status in (401, 403):
                  return False, f"{kind}: HTTP {status}"

              if status not in (200, 206):
                  return False, f"{kind}: {detail}"

              if not data:
                  return False, f"{kind}: boş veri"

              if is_html(data):
                  return False, f"{kind}: HTML hata sayfası döndü"

              if kind == "KEY":
                  return True, "Şifreleme anahtarı erişilebilir"

              if kind == "MAP":
                  if len(data) < 8:
                      return False, "MAP verisi çok küçük"

                  return True, "Başlangıç segmenti erişilebilir"

              if len(data) < 8:
                  return False, "Segment verisi çok küçük"

              return True, "Segment erişilebilir"

          def parse_segments(rows):
              segments = []
              pending_range = None
              offsets = {}

              for row in rows:
                  if row.startswith("#EXT-X-BYTERANGE:"):
                      pending_range = row.split(":", 1)[1].strip()
                      continue

                  if row.startswith("#"):
                      continue

                  byte_range = None

                  if pending_range:
                      match = re.match(
                          r"(\d+)(?:@(\d+))?",
                          pending_range
                      )

                      if match:
                          length = int(match.group(1))
                          uri = row

                          if match.group(2):
                              offset = int(match.group(2))
                          else:
                              offset = offsets.get(uri, 0)

                          byte_range = (
                              f"bytes={offset}-{offset + length - 1}"
                          )

                          offsets[uri] = offset + length

                  segments.append((row, byte_range))
                  pending_range = None

              return segments

          def check_media_playlist(client, url, depth=0):
              if depth > 3:
                  return False, "Playlist derinliği aşıldı"

              status, data, detail = get_bytes(
                  client,
                  url,
                  MAX_PLAYLIST_SIZE
              )

              if status in (401, 403):
                  return False, f"Playlist HTTP {status}"

              if status not in (200, 206):
                  return False, f"Playlist: {detail}"

              content = data.decode(
                  "utf-8-sig",
                  errors="replace"
              )

              rows = [
                  x.strip()
                  for x in content.splitlines()
                  if x.strip()
              ]

              if not rows or rows[0] != "#EXTM3U":
                  return False, "Geçersiz HLS başlığı"

              # Master playlist kontrolü
              variants = []

              for index, row in enumerate(rows):
                  if row.startswith("#EXT-X-STREAM-INF:"):
                      attrs = parse_attributes(row)

                      for next_row in rows[index + 1:]:
                          if not next_row.startswith("#"):
                              try:
                                  bandwidth = int(
                                      attrs.get("BANDWIDTH", 0)
                                  )
                              except ValueError:
                                  bandwidth = 0

                              variants.append((
                                  bandwidth,
                                  resolve_url(url, next_row),
                                  attrs.get("AUDIO")
                              ))
                              break

              if variants:
                  variants.sort(
                      key=lambda x: x[0],
                      reverse=True
                  )

                  variant_results = []

                  for bandwidth, variant_url, audio_group in (
                      variants[:MAX_VARIANTS]
                  ):
                      ok, message = check_media_playlist(
                          client,
                          variant_url,
                          depth + 1
                      )

                      variant_results.append((ok, message))

                  # Alternatif ses playlistleri
                  audio_results = []

                  for row in rows:
                      if not row.startswith("#EXT-X-MEDIA:"):
                          continue

                      attrs = parse_attributes(row)

                      if (
                          attrs.get("TYPE") == "AUDIO"
                          and attrs.get("URI")
                      ):
                          audio_url = resolve_url(
                              url,
                              attrs["URI"]
                          )

                          audio_ok, audio_message = (
                              check_media_playlist(
                                  client,
                                  audio_url,
                                  depth + 1
                              )
                          )

                          audio_results.append(
                              (audio_ok, audio_message)
                          )

                          if len(audio_results) >= 3:
                              break

                  successful = [
                      item for item in variant_results
                      if item[0]
                  ]

                  if successful:
                      failed_variants = (
                          len(variant_results) - len(successful)
                      )

                      audio_failed = any(
                          not item[0]
                          for item in audio_results
                      )

                      message = (
                          f"{len(successful)}/{len(variant_results)} "
                          "video varyantı başarılı"
                      )

                      if failed_variants:
                          message += (
                              f", {failed_variants} varyant başarısız"
                          )

                      if audio_failed:
                          message += ", ses playlistinde hata var"

                      return True, message

                  return False, "Bütün video varyantları başarısız"

              # Medya playlisti
              segment_list = parse_segments(rows)

              if not segment_list:
                  return False, "Medya segmenti bulunamadı"

              # Şifreleme anahtarlarını kontrol et
              key_results = []

              for row in rows:
                  if not row.startswith("#EXT-X-KEY:"):
                      continue

                  attrs = parse_attributes(row)

                  if attrs.get("METHOD") == "NONE":
                      continue

                  key_uri = attrs.get("URI")

                  if key_uri:
                      key_url = resolve_url(url, key_uri)

                      ok, message = check_media_resource(
                          client,
                          key_url,
                          "KEY"
                      )

                      key_results.append((ok, message))

              failed_keys = [
                  item for item in key_results
                  if not item[0]
              ]

              if failed_keys:
                  return False, failed_keys[0][1]

              # fMP4 başlangıç segmenti
              for row in rows:
                  if row.startswith("#EXT-X-MAP:"):
                      attrs = parse_attributes(row)
                      map_uri = attrs.get("URI")

                      if map_uri:
                          map_url = resolve_url(url, map_uri)

                          byte_range = attrs.get("BYTERANGE")
                          range_header = None

                          if byte_range:
                              match = re.match(
                                  r"(\d+)(?:@(\d+))?",
                                  byte_range
                              )

                              if match:
                                  length = int(match.group(1))
                                  offset = int(
                                      match.group(2) or 0
                                  )

                                  range_header = (
                                      f"bytes={offset}-"
                                      f"{offset + length - 1}"
                                  )

                          ok, message = check_media_resource(
                              client,
                              map_url,
                              "MAP",
                              range_header
                          )

                          if not ok:
                              return False, message

              # İlk 3 segmenti kontrol et
              selected = segment_list[:SEGMENTS_TO_TEST]

              success_count = 0
              errors = []

              for segment, byte_range in selected:
                  segment_url = resolve_url(url, segment)

                  ok, message = check_media_resource(
                      client,
                      segment_url,
                      "SEGMENT",
                      byte_range
                  )

                  if ok:
                      success_count += 1
                  else:
                      errors.append(message)

              if success_count == len(selected):
                  return True, (
                      f"{success_count}/{len(selected)} "
                      "segment başarılı"
                  )

              if success_count > 0:
                  return True, (
                      f"KISMİ: {success_count}/{len(selected)} "
                      "segment başarılı | " + "; ".join(errors)
                  )

              return False, (
                  "Segmentlerin tamamı başarısız | "
                  + "; ".join(errors)
              )

          def probe_test(url):
              cmd = [
                  "ffprobe",
                  "-v", "error",
                  "-rw_timeout", "20000000",
                  "-user_agent", USER_AGENT,
                  "-probesize", "3000000",
                  "-analyzeduration", "3000000",
                  "-show_entries",
                  "stream=codec_type,codec_name",
                  "-of", "json",
                  "-i", url
              ]

              try:
                  result = subprocess.run(
                      cmd,
                      capture_output=True,
                      text=True,
                      timeout=25
                  )

                  if result.returncode != 0:
                      return False, False, False

                  streams = json.loads(
                      result.stdout
                  ).get("streams", [])

                  video = any(
                      s.get("codec_type") == "video"
                      for s in streams
                  )

                  audio = any(
                      s.get("codec_type") == "audio"
                      for s in streams
                  )

                  return bool(video or audio), video, audio

              except Exception:
                  return False, False, False

          def ffmpeg_test(url):
              cmd = [
                  "ffmpeg",
                  "-nostdin",
                  "-hide_banner",
                  "-loglevel", "error",
                  "-rw_timeout", "20000000",
                  "-user_agent", USER_AGENT,
                  "-i", url,
                  "-t", "4",
                  "-map", "0:v:0?",
                  "-map", "0:a:0?",
                  "-f", "null",
                  "-"
              ]

              try:
                  result = subprocess.run(
                      cmd,
                      capture_output=True,
                      text=True,
                      timeout=30
                  )

                  return result.returncode == 0

              except Exception:
                  return False

          def check_channel(channel):
              name, url = channel

              try:
                  parsed = urlparse(url)

                  if parsed.scheme not in ("http", "https"):
                      return (
                          name,
                          "GEÇERSİZ URL",
                          "HTTP/HTTPS adresi değil"
                      )

                  with make_client() as client:
                      is_hls = (
                          ".m3u8" in url.lower()
                      )

                      if is_hls:
                          hls_ok, hls_message = (
                              check_media_playlist(client, url)
                          )

                          if not hls_ok:
                              return (
                                  name,
                                  "HLS HATASI",
                                  hls_message
                              )

                      else:
                          status, data, detail = get_bytes(
                              client,
                              url,
                              32768
                          )

                          if status in (401, 403):
                              return (
                                  name,
                                  "YETKİLENDİRME",
                                  f"HTTP {status}"
                              )

                          if status not in (200, 206):
                              return (
                                  name,
                                  "BAĞLANTI HATASI",
                                  detail
                              )

                          if data.lstrip().startswith(b"#EXTM3U"):
                              hls_ok, hls_message = (
                                  check_media_playlist(client, url)
                              )

                              if not hls_ok:
                                  return (
                                      name,
                                      "HLS HATASI",
                                      hls_message
                                  )

                              hls_message = hls_message

                          else:
                              hls_message = "HTTP erişilebilir"

                  probe_ok, video, audio = probe_test(url)
                  ff_ok = ffmpeg_test(url)

                  if probe_ok and video and audio and ff_ok:
                      return (
                          name,
                          "BAŞARILI",
                          hls_message + " | Ses ve görüntü doğrulandı"
                      )

                  if probe_ok or ff_ok:
                      return (
                          name,
                          "KISMİ",
                          hls_message + (
                              f" | Video: {video}, Ses: {audio}"
                          )
                      )

                  return (
                      name,
                      "ERİŞİLEBİLİR",
                      hls_message + " | Medya çözümlemesi doğrulanamadı"
                  )

              except Exception as e:
                  return (
                      name,
                      "KONTROL HATASI",
                      str(e)[:150]
                  )

          print(f"Toplam kanal: {len(channels)}")
          print("Gelişmiş HLS kontrolü başlıyor...\n")

          results = []

          with ThreadPoolExecutor(
              max_workers=WORKERS
          ) as executor:

              futures = [
                  executor.submit(check_channel, channel)
                  for channel in channels
              ]

              for future in as_completed(futures):
                  try:
                      result = future.result()
                      results.append(result)

                      print(
                          f"{result[1]} | {result[0]} | "
                          f"{result[2]}"
                      )

                  except Exception as e:
                      print("Kontrol hatası:", str(e)[:100])

          results.sort(key=lambda x: x[0].casefold())

          counts = {}

          for name, state, detail in results:
              counts[state] = counts.get(state, 0) + 1

          summary = [
              "# MHR-1453 TV - Gelişmiş HLS Raporu",
              "",
              f"- Toplam kanal: {len(channels)}",
              f"- Kontrol edilen: {len(results)}",
              f"- Paralel işçi: {WORKERS}",
              f"- Segment kontrolü: İlk {SEGMENTS_TO_TEST}",
              f"- Tekrar deneme: {RETRIES}",
              ""
          ]

          for state, count in sorted(counts.items()):
              summary.append(f"- {state}: {count}")

          summary.extend([
              "",
              "| Kanal | Durum | Detay |",
              "|---|---|---|"
          ])

          for name, state, detail in results:
              name = name.replace("|", "/")
              detail = detail.replace("|", "/")

              summary.append(
                  f"| {name} | {state} | {detail} |"
              )

          summary.extend([
              "",
              "> HLS segmentleri, başlangıç segmentleri ve "
              "şifreleme anahtarları kontrol edilmiştir.",
              "",
              "> Erişim testi başarılı olması yayının her "
              "oynatıcıda çalışacağını garanti etmez."
          ])

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8"
          ) as f:
              f.write("\n".join(summary) + "\n")

          print("\nKontrol tamamlandı!")
          PY
