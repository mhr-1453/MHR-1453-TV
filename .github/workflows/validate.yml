
name: MHR-1453 TV - Fast HLS Monitor

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:
  push:
    paths:
      - "mhr-1453-tv.m3u"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

concurrency:
  group: mhr1453-hls-check
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MHR_PROXY: ${{ secrets.MHR_PROXY_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --upgrade httpx

      - name: Run channel checks
        run: |
          python3 - <<'PY'
          import os
          import re
          import json
          import httpx
          import subprocess
          from pathlib import Path
          from urllib.parse import urljoin
          from concurrent.futures import ThreadPoolExecutor, as_completed

          FILE = Path("mhr-1453-tv.m3u")

          USER_AGENT = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 Chrome/131.0 Safari/537.36"
          )

          HEADERS = {
              "User-Agent": USER_AGENT,
              "Accept": "*/*"
          }

          TIMEOUT = httpx.Timeout(
              connect=8,
              read=15,
              write=8,
              pool=8
          )

          MAX_WORKERS = 8
          PROXY = os.environ.get("MHR_PROXY", "").strip() or None

          if not FILE.exists():
              raise SystemExit("mhr-1453-tv.m3u bulunamadı!")

          lines = [
              x.strip()
              for x in FILE.read_text(
                  encoding="utf-8-sig"
              ).splitlines()
              if x.strip()
          ]

          if not lines or lines[0] != "#EXTM3U":
              raise SystemExit("Geçersiz M3U dosyası!")

          channels = []
          pending = None

          for line in lines[1:]:
              if line.startswith("#EXTINF:"):
                  pending = line.rsplit(",", 1)[-1].strip()

              elif not line.startswith("#") and pending:
                  channels.append((pending, line))
                  pending = None

          if not channels:
              raise SystemExit("Kanal bulunamadı!")

          print(f"Toplam kanal: {len(channels)}")
          print("Kontrol başlıyor...")

          def make_client(proxy=None):
              return httpx.Client(
                  headers=HEADERS,
                  timeout=TIMEOUT,
                  follow_redirects=True,
                  proxy=proxy
              )

          def fetch(client, url, limit=32768):
              with client.stream("GET", url) as response:
                  status = response.status_code

                  data = bytearray()

                  if status in (200, 206):
                      for chunk in response.iter_bytes(8192):
                          data.extend(chunk)
                          if len(data) >= limit:
                              break

                  return status, bytes(data[:limit])

          def hls_check(client, url, depth=0):
              if depth > 2:
                  return False, "Alt playlist derinliği aşıldı"

              try:
                  status, data = fetch(client, url)

                  if status in (401, 403):
                      return False, f"HTTP {status}: erişim reddedildi"

                  if status not in (200, 206):
                      return False, f"Playlist HTTP {status}"

                  content = data.decode(
                      "utf-8-sig",
                      errors="replace"
                  )

                  rows = [
                      x.strip()
                      for x in content.splitlines()
                      if x.strip()
                  ]

                  if not rows or rows[0] != "#EXTM3U":
                      return False, "Geçersiz HLS playlist"

                  # Master playlist içindeki ilk video playlisti
                  for index, row in enumerate(rows):
                      if row.startswith("#EXT-X-STREAM-INF"):
                          for next_row in rows[index + 1:]:
                              if not next_row.startswith("#"):
                                  return hls_check(
                                      client,
                                      urljoin(url, next_row),
                                      depth + 1
                                  )

                  # İlk segmenti kontrol et
                  segments = [
                      row for row in rows
                      if not row.startswith("#")
                  ]

                  if not segments:
                      return False, "Segment bulunamadı"

                  segment_url = urljoin(url, segments[0])
                  seg_status, seg_data = fetch(
                      client,
                      segment_url,
                      16384
                  )

                  if seg_status in (401, 403):
                      return False, f"Segment HTTP {seg_status}"

                  if seg_status not in (200, 206):
                      return False, f"Segment HTTP {seg_status}"

                  if not seg_data:
                      return False, "Boş segment"

                  return True, "HLS playlist ve segment erişilebilir"

              except Exception as e:
                  return False, f"HLS hatası: {str(e)[:100]}"

          def probe_test(url, proxy=None):
              cmd = [
                  "ffprobe",
                  "-v", "error",
                  "-rw_timeout", "12000000",
                  "-user_agent", USER_AGENT,
                  "-probesize", "2000000",
                  "-analyzeduration", "2000000",
                  "-show_entries",
                  "stream=codec_type,codec_name",
                  "-of", "json"
              ]

              if proxy:
                  cmd += ["-http_proxy", proxy]

              cmd += ["-i", url]

              try:
                  result = subprocess.run(
                      cmd,
                      capture_output=True,
                      text=True,
                      timeout=15
                  )

                  if result.returncode != 0:
                      return False, False, False

                  streams = json.loads(
                      result.stdout
                  ).get("streams", [])

                  video = any(
                      s.get("codec_type") == "video"
                      for s in streams
                  )

                  audio = any(
                      s.get("codec_type") == "audio"
                      for s in streams
                  )

                  return bool(video or audio), video, audio

              except Exception:
                  return False, False, False

          def ffmpeg_test(url, proxy=None):
              cmd = [
                  "ffmpeg",
                  "-nostdin",
                  "-hide_banner",
                  "-loglevel", "error",
                  "-rw_timeout", "12000000",
                  "-user_agent", USER_AGENT
              ]

              if proxy:
                  cmd += ["-http_proxy", proxy]

              cmd += [
                  "-i", url,
                  "-t", "3",
                  "-map", "0:v:0?",
                  "-map", "0:a:0?",
                  "-f", "null",
                  "-"
              ]

              try:
                  result = subprocess.run(
                      cmd,
                      capture_output=True,
                      text=True,
                      timeout=18
                  )

                  return result.returncode == 0

              except Exception:
                  return False

          def check_route(name, url, proxy=None):
              route = "Doğrudan" if not proxy else "Tanımlı proxy"

              try:
                  with make_client(proxy) as client:
                      status, data = fetch(client, url)

                      if status in (401, 403):
                          return {
                              "ok": False,
                              "state": "YETKİLENDİRME",
                              "detail": f"HTTP {status}",
                              "route": route
                          }

                      if status in (404, 410):
                          return {
                              "ok": False,
                              "state": "KANAL HATASI",
                              "detail": f"HTTP {status}",
                              "route": route
                          }

                      if status not in (200, 206):
                          return {
                              "ok": False,
                              "state": "BAĞLANTI HATASI",
                              "detail": f"HTTP {status}",
                              "route": route
                          }

                      is_hls = (
                          ".m3u8" in url.lower()
                          or data.lstrip().startswith(b"#EXTM3U")
                      )

                      if is_hls:
                          hls_ok, detail = hls_check(client, url)

                          if not hls_ok:
                              return {
                                  "ok": False,
                                  "state": "HLS HATASI",
                                  "detail": detail,
                                  "route": route
                              }

                      return {
                          "ok": True,
                          "state": "ERİŞİLEBİLİR",
                          "detail": (
                              detail if is_hls
                              else "HTTP bağlantısı başarılı"
                          ),
                          "route": route
                      }

              except Exception as e:
                  return {
                      "ok": False,
                      "state": "BAĞLANTI HATASI",
                      "detail": str(e)[:100],
                      "route": route
                  }

          def check_channel(channel):
              name, url = channel

              # Önce doğrudan bağlantı
              result = check_route(name, url)

              # Yalnızca bağlantı hatasında tanımlı proxy'yi dene.
              # 401/403 durumunda proxy ile erişim aşılmaya çalışılmaz.
              if (
                  not result["ok"]
                  and result["state"] == "BAĞLANTI HATASI"
                  and PROXY
              ):
                  result = check_route(name, url, PROXY)

              if not result["ok"]:
                  return (
                      name,
                      result["state"],
                      result["detail"],
                      result["route"]
                  )

              probe_ok, video, audio = probe_test(
                  url,
                  PROXY if result["route"] == "Tanımlı proxy" else None
              )

              ff_ok = ffmpeg_test(
                  url,
                  PROXY if result["route"] == "Tanımlı proxy" else None
              )

              if probe_ok and video and audio and ff_ok:
                  state = "BAŞARILI"
                  detail = "HLS + ses + görüntü doğrulandı"

              elif probe_ok or ff_ok:
                  state = "KISMİ"
                  detail = (
                      f"Medya bulundu | Video: {video} | Ses: {audio}"
                  )

              else:
                  state = "ERİŞİLEBİLİR"
                  detail = (
                      "HTTP/HLS erişilebilir, medya çözümlemesi "
                      "doğrulanamadı"
                  )

              return name, state, detail, result["route"]

          results = []

          with ThreadPoolExecutor(
              max_workers=MAX_WORKERS
          ) as executor:

              futures = [
                  executor.submit(check_channel, channel)
                  for channel in channels
              ]

              for future in as_completed(futures):
                  try:
                      result = future.result()
                      results.append(result)

                      print(
                          f"{result[1]} | {result[0]} | "
                          f"{result[2]}"
                      )

                  except Exception as e:
                      print("Kontrol hatası:", str(e)[:100])

          results.sort(key=lambda x: x[0].casefold())

          counts = {}

          for name, state, detail, route in results:
              counts[state] = counts.get(state, 0) + 1

          summary = [
              "# MHR-1453 TV - HLS Kontrol Raporu",
              "",
              f"- Toplam kanal: {len(channels)}",
              f"- Kontrol edilen: {len(results)}",
              f"- Paralel işçi: {MAX_WORKERS}",
              f"- Tanımlı proxy: {'Var' if PROXY else 'Yok'}",
              ""
          ]

          for state, count in sorted(counts.items()):
              summary.append(f"- {state}: {count}")

          summary.extend([
              "",
              "| Kanal | Durum | Detay | Bağlantı |",
              "|---|---|---|---|"
          ])

          for name, state, detail, route in results:
              name = name.replace("|", "/")
              detail = detail.replace("|", "/")
              summary.append(
                  f"| {name} | {state} | {detail} | {route} |"
              )

          summary.extend([
              "",
              "> HTTP erişimi tek başına yayının oynatılabildiğini "
              "kanıtlamaz.",
              "",
              "> 401 ve 403 erişim/yetkilendirme yanıtlarıdır."
          ])

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8"
          ) as f:
              f.write("\n".join(summary) + "\n")

          print("\nKontrol tamamlandı!")
          PY
