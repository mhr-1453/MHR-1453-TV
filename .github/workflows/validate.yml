
name: MHR-1453 TV - HLS Check

on:
  workflow_dispatch:
  push:
    paths:
      - "mhr-1453-tv.m3u"
      - ".github/workflows/validate.yml"
  schedule:
    - cron: "17 5,17 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python dependency
        run: pip install httpx

      - name: Check M3U and HLS
        run: |
          python - <<'PY'
          import httpx
          import re
          import time
          from urllib.parse import urljoin
          from concurrent.futures import ThreadPoolExecutor, as_completed

          FILE = "mhr-1453-tv.m3u"
          HEADERS = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "*/*"
          }

          def fetch(url):
              for attempt in range(3):
                  try:
                      response = httpx.get(
                          url,
                          headers=HEADERS,
                          timeout=15,
                          follow_redirects=True
                      )

                      if response.status_code in (401, 403):
                          return None, f"HTTP {response.status_code}"

                      response.raise_for_status()
                      return response.text, "OK"

                  except Exception as error:
                      last_error = str(error)

                      if attempt < 2:
                          time.sleep(1)

              return None, last_error

          def check_channel(channel):
              name, url = channel

              content, error = fetch(url)

              if content is None:
                  return name, "BAŞARISIZ", error

              if "#EXTM3U" not in content:
                  return name, "ERİŞİLEBİLİR", "HLS playlist değil"

              lines = [
                  line.strip()
                  for line in content.splitlines()
                  if line.strip()
              ]

              # Master playlist ise ilk varyantı kullan.
              for index, line in enumerate(lines):
                  if line.startswith("#EXT-X-STREAM-INF"):
                      for next_line in lines[index + 1:]:
                          if not next_line.startswith("#"):
                              url = urljoin(url, next_line)
                              content, error = fetch(url)

                              if content is None:
                                  return name, "BAŞARISIZ", error

                              lines = [
                                  item.strip()
                                  for item in content.splitlines()
                                  if item.strip()
                              ]
                              break
                      break

              segments = [
                  line for line in lines
                  if not line.startswith("#")
              ][:3]

              if not segments:
                  return name, "BAŞARISIZ", "Segment bulunamadı"

              success = 0

              for segment in segments:
                  segment_url = urljoin(url, segment)
                  _, error = fetch(segment_url)

                  if error == "OK":
                      success += 1

              if success == len(segments):
                  return name, "BAŞARILI", f"{success}/{len(segments)} segment"

              if success > 0:
                  return name, "KISMİ", f"{success}/{len(segments)} segment"

              return name, "BAŞARISIZ", "Segmentlere erişilemiyor"

          # M3U oku
          with open(FILE, encoding="utf-8-sig") as file:
              lines = [
                  line.strip()
                  for line in file
                  if line.strip()
              ]

          if not lines or lines[0] != "#EXTM3U":
              raise SystemExit("Geçersiz M3U dosyası")

          channels = []
          name = None

          for line in lines[1:]:
              if line.startswith("#EXTINF"):
                  name = line.rsplit(",", 1)[-1].strip()

              elif not line.startswith("#") and name:
                  channels.append((name, line))
                  name = None

          print(f"Toplam kanal: {len(channels)}")

          results = []

          with ThreadPoolExecutor(max_workers=8) as pool:
              futures = [
                  pool.submit(check_channel, channel)
                  for channel in channels
              ]

              for future in as_completed(futures):
                  result = future.result()
                  results.append(result)
                  print(" | ".join(result))

          results.sort(key=lambda item: item[0].lower())

          summary = [
              "# MHR-1453 TV HLS Raporu",
              "",
              f"Toplam kanal: {len(channels)}",
              "",
              "| Kanal | Durum | Detay |",
              "|---|---|---|"
          ]

          for name, status, detail in results:
              summary.append(
                  f"| {name} | {status} | {detail} |"
              )

          with open(
              __import__("os").environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8"
          ) as report:
              report.write("\n".join(summary) + "\n")

          print("Kontrol tamamlandı.")
          PY
